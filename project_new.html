<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新建项目</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, sans-serif; background: #f0f2f5; padding: 16px; }
        .container { max-width: 480px; margin: 0 auto; }
        h1 { font-size: 20px; color: #1a3a5c; margin-bottom: 16px; }
        .form-group { margin-bottom: 16px; }
        label { display: block; font-size: 14px; color: #5a5d6b; margin-bottom: 6px; }
        input[type=text], textarea {
            width: 100%; padding: 12px; border: 1px solid #d0d5dd;
            border-radius: 8px; font-size: 14px;
        }
        .field-item { display: flex; gap: 8px; margin-bottom: 8px; }
        .field-item input { flex: 1; }
        .field-item button {
            background: #fde8e8; color: #e74c3c; border: none;
            padding: 0 12px; border-radius: 8px; cursor: pointer;
        }
        .btn {
            width: 100%; padding: 14px; border: none; border-radius: 12px;
            font-size: 16px; font-weight: 600; cursor: pointer; margin-bottom: 10px;
        }
        .btn-primary { background: #07c160; color: white; }
        .btn-secondary { background: #e8ecf0; color: #1a3a5c; }
        .add-field { color: #07c160; background: none; border: none; font-size: 14px; cursor: pointer; padding: 6px 0; }
        .quick-template {
            background: #f0f7ff; border-radius: 8px; padding: 12px;
            margin-bottom: 16px; font-size: 13px;
        }
        .quick-template button {
            background: #1a3a5c; color: white; border: none;
            padding: 6px 12px; border-radius: 6px; font-size: 12px;
            cursor: pointer; margin-right: 6px; margin-top: 6px;
        }
        .import-btn {
            background: #ff9800; color: white; border: none;
            padding: 10px 16px; border-radius: 8px; font-size: 14px;
            cursor: pointer; width: 100%; margin-bottom: 10px;
        }
        .field-count {
            font-size: 13px; color: #8c8f9c; margin-bottom: 8px;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>➕ 新建项目</h1>

    <div class="form-group">
        <label>项目名称</label>
        <input type="text" id="projectName" placeholder="如：ICU患者预后研究">
    </div>

    <div class="form-group">
        <label>项目描述（可选）</label>
        <textarea id="projectDesc" placeholder="简要说明研究目的"></textarea>
    </div>

    <div class="quick-template">
        <div>⚡ 快速填充模板：</div>
        <button onclick="loadTemplate('血常规')">血常规</button>
        <button onclick="loadTemplate('生化')">生化</button>
        <button onclick="loadTemplate('凝血')">凝血</button>
    </div>

    <div class="form-group">
        <label>表头字段</label>
        <button class="import-btn" onclick="document.getElementById('excelInput').click()">
            📥 导入 Excel 表头（自动读取第一行）
        </button>
        <input type="file" id="excelInput" accept=".xlsx,.xls" style="display:none">
        <div class="field-count" id="fieldCount">当前 0 个字段</div>
        <div id="fieldList"></div>
        <button class="add-field" onclick="addField()">+ 手动添加字段</button>
    </div>

    <button class="btn btn-primary" onclick="saveProject()">保存项目</button>
    <button class="btn btn-secondary" onclick="history.back()">返回</button>
</div>

<script>
    const templates = {
        '血常规': ['白细胞', '红细胞', '血红蛋白', '血小板', '中性细胞比%', '淋巴细胞比%', '单核细胞比%'],
        '生化': ['ALT', 'AST', '肌酐', '尿素', '血糖', '白蛋白'],
        '凝血': ['PT', 'APTT', 'INR', 'D-二聚体', '纤维蛋白原']
    };

    function updateCount() {
        const count = document.querySelectorAll('.field-item').length;
        document.getElementById('fieldCount').textContent = `当前 ${count} 个字段`;
    }

    function addField(name = '', unit = '') {
        const list = document.getElementById('fieldList');
        const div = document.createElement('div');
        div.className = 'field-item';
        div.innerHTML = `
            <input type="text" placeholder="指标名称" value="${name}" class="field-name">
            <input type="text" placeholder="单位" value="${unit}" class="field-unit" style="max-width:80px">
            <button onclick="this.parentElement.remove(); updateCount()">✕</button>
        `;
        list.appendChild(div);
        updateCount();
    }

    function loadTemplate(name) {
        document.getElementById('fieldList').innerHTML = '';
        templates[name].forEach(f => addField(f));
    }

    // 导入 Excel 表头
    document.getElementById('excelInput').addEventListener('change', async function() {
        const file = this.files[0];
        if (!file) return;

        const formData = new FormData();
        formData.append('excel', file);

        try {
            const res = await fetch('/api/parse_excel_header', {
                method: 'POST',
                body: formData
            });
            const data = await res.json();

            if (data.success) {
                document.getElementById('fieldList').innerHTML = '';
                data.headers.forEach(h => addField(h));
                alert(`成功导入 ${data.headers.length} 个字段`);
            } else {
                alert('解析失败：' + (data.error || '未知错误'));
            }
        } catch (err) {
            alert('上传失败：' + err.message);
        }
        this.value = '';
    });

    async function saveProject() {
        const name = document.getElementById('projectName').value.trim();
        if (!name) return alert('请输入项目名称');

        const fields = [];
        document.querySelectorAll('.field-item').forEach(item => {
            const fn = item.querySelector('.field-name').value.trim();
            const fu = item.querySelector('.field-unit').value.trim();
            if (fn) fields.push({ field_name: fn, field_unit: fu });
        });

        if (fields.length === 0) return alert('请至少添加一个字段');

        const res = await fetch('/api/project', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                name: name,
                description: document.getElementById('projectDesc').value,
                fields: fields
            })
        });

        const data = await res.json();
        if (data.success) {
            alert('项目创建成功！');
            location.href = '/projects';
        } else {
            alert('失败：' + (data.error || '未知错误'));
        }
    }

    addField();
</script>
</body>
</html>
