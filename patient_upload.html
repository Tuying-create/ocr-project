<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>患者数据录入</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, sans-serif; }
        body { font-family: -apple-system, sans-serif; background: #f0f2f5; padding: 16px; padding-bottom: 60px;}
        .container { max-width: 480px; margin: 0 auto; }
        h1 { font-size: 20px; color: #1a3a5c; margin-bottom: 16px; }
        h2 { font-size: 15px; color: #1a3a5c; margin: 16px 0 8px 0; }
        
        .upload-area {
            border: 2px dashed #07c160; border-radius: 12px;
            padding: 24px 16px; text-align: center; cursor: pointer;
            background: #f0fdf4; margin-bottom: 16px;
        }
        .upload-area .icon { font-size: 48px; display: block; margin-bottom: 8px; }
        #fileInput { display: none; }
        .loading { display: none; text-align: center; padding: 24px 0; }
        .spinner {
            width: 40px; height: 40px; border: 4px solid #e8ecf0;
            border-top: 4px solid #07c160; border-radius: 50%;
            animation: spin 0.8s linear infinite; margin: 0 auto 12px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        .basic-item {
            background: white; border-radius: 8px; padding: 10px 12px;
            margin-bottom: 8px; display: flex; align-items: center; gap: 8px;
        }
        .basic-item label { flex: 1; font-size: 13px; color: #1a3a5c; }
        .basic-item input, .basic-item select {
            flex: 1.5; padding: 8px; border: 1px solid #d0d5dd;
            border-radius: 6px; font-size: 14px;
        }
        /* 给住院号输入框加个红框提示必填 */
        #basic_hospital_id { border-color: #ff4d4f; background-color: #fff1f0; font-weight: bold; }
        
        .review-item {
            background: white; border-radius: 8px; padding: 10px 12px;
            margin-bottom: 8px; display: flex; align-items: center; gap: 8px;
        }
        .review-item label { flex: 1; font-size: 14px; color: #1a3a5c; }
        .review-item input, .review-item select {
            flex: 1.2; padding: 8px; border: 1px solid #d0d5dd;
            border-radius: 6px; font-size: 14px;
        }
        .review-item.locked { background: #e8f5e9; }
        .review-item.locked input, .review-item.locked select {
            background: #f1f8e9; color: #2e7d32; font-weight: 600; border-color: #c8e6c9;
        }
        .review-item .unit { font-size: 12px; color: #8c8f9c; }
        
        .btn {
            width: 100%; padding: 14px; border: none; border-radius: 12px;
            font-size: 16px; font-weight: 600; cursor: pointer; margin-bottom: 10px;
        }
        .btn-primary { background: #07c160; color: white; }
        .btn-secondary { background: #e8ecf0; color: #1a3a5c; }
        .btn-warning { background: #ff9800; color: white; }
        .btn-unlock { background: #e74c3c; color: white; }
        .raw-text {
            background: #f8f9fb; border-radius: 8px; padding: 12px;
            font-size: 12px; color: #5a5d6b; max-height: 150px;
            overflow-y: auto; white-space: pre-wrap; margin-top: 12px; display: none;
        }
        .status-bar {
            background: #e8f4ff; border-radius: 8px; padding: 10px 12px;
            font-size: 13px; color: #1a3a5c; margin-bottom: 12px;
        }
        .select-patient {
            background: #fff3e0; border-radius: 8px; padding: 12px;
            margin-bottom: 16px; border: 1px solid #ffcc80;
        }
        .select-patient label {
            font-size: 14px; color: #e65100; display: block; margin-bottom: 8px;
            font-weight: 600;
        }
        .select-patient select {
            width: 100%; padding: 12px; border: 1px solid #d0d5dd;
            border-radius: 8px; font-size: 14px; background: white;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>📷 患者数据录入</h1>

    <!-- 选择已有患者 -->
    <div class="select-patient" id="selectPatientBox" style="display:none;">
        <label>📋 快速调取历史患者（不影响新建）</label>
        <select id="patientSelect" onchange="onSelectPatient()">
            <option value="">-- 当前为：全新手动录入 --</option>
        </select>
    </div>

    <!-- 拍照识别区 -->
    <div class="upload-area" id="uploadArea">
        <span class="icon">📷</span>
        <p>点击拍照或选择图片（自动识别）</p>
        <span style="color:#8c8f9c;font-size:13px;">如果不拍照，可直接在下方手动录入</span>
    </div>
    <input type="file" id="fileInput" accept="image/*" capture="environment" multiple>

    <div class="loading" id="loading">
        <div class="spinner"></div>
        <p>AI 识别中，请稍候...</p>
    </div>

    <!-- 表单区：打开页面直接显示 -->
    <div id="reviewArea">
        <div class="status-bar" id="statusBar">📝 直接填写下方【住院号】和指标，即可保存新患者</div>

        <h2>👤 患者基本信息</h2>
        <div id="basicList"></div>

        <h2>📊 化验指标 <span style="font-size:12px;color:#8c8f9c;font-weight:normal;">（绿色🔒为已保存）</span></h2>
        <div id="reviewList"></div>

        <button class="btn btn-primary" onclick="savePatient()">✅ 确认保存</button>
        <button class="btn btn-unlock" onclick="unlockAll()">🔓 解锁全部字段</button>
        <button class="btn btn-warning" onclick="clearCurrent()">🆕 重置为全新录入</button>
        <button class="btn btn-secondary" onclick="backToProject()">返回项目</button>

        <div class="raw-text" id="rawText"></div>
    </div>
</div>

<script>
    const pathParts = location.pathname.split('/');
    let projectId = null;
    let patientId = null;
    let currentPatientId = null;
    let savedFieldIds = new Set();

    if (location.pathname.includes('/patient/') && location.pathname.includes('/edit')) {
        patientId = pathParts[2];
    } else {
        projectId = pathParts[2];
    }

    const uploadArea = document.getElementById('uploadArea');
    const fileInput = document.getElementById('fileInput');
    const loading = document.getElementById('loading');
    const basicList = document.getElementById('basicList');
    const reviewList = document.getElementById('reviewList');
    const rawText = document.getElementById('rawText');
    const statusBar = document.getElementById('statusBar');
    const patientSelect = document.getElementById('patientSelect');
    const selectPatientBox = document.getElementById('selectPatientBox');

    const basicFields = [
        { key: 'hospital_id', label: '住院号' },
        { key: 'name', label: '姓名' },
        { key: 'gender', label: '性别' }, // 这里会被渲染成下拉框
        { key: 'age', label: '年龄' },
        { key: 'admission_date', label: '住院日期' },
        { key: 'discharge_date', label: '出院日期' }
    ];

    let currentValues = {};
    let currentRawText = '';
    let uploadCount = 0;
    let projectFields = [];

    function renderBasicFields(data = {}) {
        basicList.innerHTML = basicFields.map(f => {
            let inputHtml = '';
            if (f.label.includes('住院日期') || f.label.includes('出院日期')) {
                inputHtml = `<input type="date" data-key="${f.key}" id="basic_${f.key}" value="${data[f.key] || ''}">`;
            } else if (f.key === 'gender') {
                // 性别特殊处理为下拉框
                const currentVal = data[f.key] || '';
                inputHtml = `
                    <select data-key="${f.key}" id="basic_${f.key}">
                        <option value="" ${!currentVal ? 'selected' : ''}>请选择</option>
                        <option value="男" ${currentVal === '男' ? 'selected' : ''}>男</option>
                        <option value="女" ${currentVal === '女' ? 'selected' : ''}>女</option>
                        <option value="未知" ${currentVal === '未知' ? 'selected' : ''}>未知</option>
                    </select>
                `;
            } else {
                inputHtml = `<input type="text" data-key="${f.key}" id="basic_${f.key}" value="${data[f.key] || ''}" placeholder="必填项">`;
            }
            return `
                <div class="basic-item">
                    <label>${f.label}</label>
                    ${inputHtml}
                </div>
            `;
        }).join('');
    }

    function renderReview() {
        const items = Object.values(currentValues);
        if (items.length === 0) {
            reviewList.innerHTML = '<div style="color:#8c8f9c;text-align:center;padding:12px;">暂无指标</div>';
            return;
        }
        reviewList.innerHTML = items.map(item => {
            let inputHtml = '';
            const type = item.field_type || 'number';
            const isLocked = savedFieldIds.has(item.field_id);

            if (isLocked) {
                inputHtml = `<input type="text" value="${item.value}" readonly style="background:#f1f8e9;color:#2e7d32;font-weight:600;">`;
            } else if (type === 'yesno') {
                const isYes = item.value === '是';
                const isNo = item.value === '否';
                inputHtml = `
                    <select data-field-id="${item.field_id}">
                        <option value="" ${!isYes && !isNo ? 'selected' : ''}>未选</option>
                        <option value="否" ${isNo ? 'selected' : ''}>否</option>
                        <option value="是" ${isYes ? 'selected' : ''}>是</option>
                    </select>
                `;
            } else {
                inputHtml = `<input type="text" value="${item.value}" data-field-id="${item.field_id}" placeholder="请输入">`;
            }

            return `
                <div class="review-item ${isLocked ? 'locked' : ''}">
                    <label>${item.field_name} <span class="unit">${item.field_unit || ''}</span>${isLocked ? ' 🔒' : ''}</label>
                    ${inputHtml}
                </div>
            `;
        }).join('');
    }

    async function loadPendingPatients() {
        if (!projectId) return;
        try {
            const res = await fetch(`/api/project/${projectId}/patients`);
            const data = await res.json();
            if (data.patients && data.patients.length > 0) {
                const validPatients = data.patients.filter(p => p.hospital_id && p.hospital_id !== '0' && p.hospital_id !== 'null');
                
                if (validPatients.length > 0) {
                    patientSelect.innerHTML = '<option value="">-- 当前为：全新手动录入 --</option>' +
                        validPatients.map(p => `<option value="${p.id}">住院号: ${p.hospital_id} ${p.name ? '('+p.name+')' : ''}</option>`).join('');
                    selectPatientBox.style.display = 'block';
                }
            }
        } catch (err) {
            console.log('加载患者列表失败', err);
        }
    }

    async function fetchProjectFields() {
        if (projectFields.length > 0) return projectFields;
        const res = await fetch('/api/project/' + projectId);
        const proj = await res.json();
        projectFields = proj.fields;
        return projectFields;
    }

    // 重置为手动新建表单
    async function renderEmptyForm() {
        currentValues = {};
        savedFieldIds = new Set();
        currentPatientId = null;
        
        renderBasicFields({}); // 渲染空的住院号等
        statusBar.textContent = '📝 请在下方【住院号】框内输入新编号，并填写指标';
        rawText.style.display = 'none';

        const fields = await fetchProjectFields();
        fields.forEach(f => {
            currentValues[f.id] = {
                field_id: f.id,
                field_name: f.field_name,
                field_unit: f.field_unit,
                field_type: f.field_type || 'number',
                value: ''
            };
        });
        renderReview();
    }

    // 下拉框选择患者
    async function onSelectPatient() {
        const pid = patientSelect.value;
        
        if (!pid) {
            // 选回了全新的那一项，清空表单
            await renderEmptyForm();
            return;
        }

        const res = await fetch('/api/patient/' + pid);
        const p = await res.json();

        currentPatientId = p.id;
        renderBasicFields(p);

        const fields = await fetchProjectFields();
        currentValues = {};
        savedFieldIds = new Set();

        fields.forEach(f => {
            const existingValue = p.values[f.id] || '';
            currentValues[f.id] = {
                field_id: f.id,
                field_name: f.field_name,
                field_unit: f.field_unit,
                field_type: f.field_type || 'number',
                value: existingValue
            };
            if (existingValue && existingValue.trim() !== '') {
                savedFieldIds.add(f.id);
            }
        });
        
        renderReview();
        statusBar.textContent = `已调取患者：${p.hospital_id}，绿色字段已锁定`;
    }

    uploadArea.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', function() {
        if (this.files.length > 0) uploadImages(this.files);
        this.value = '';
    });

    async function uploadImages(files) {
        loading.style.display = 'block';

        const formData = new FormData();
        for (let f of files) formData.append('images', f);

        try {
            const res = await fetch(`/api/project/${projectId}/patient/upload`, {
                method: 'POST', body: formData
            });
            const data = await res.json();
            loading.style.display = 'none';

            if (data.success) {
                if (!currentPatientId) {
                    // 自动填入基本信息（如果输入框有值就不覆盖）
                    if (data.basic_info) {
                        basicFields.forEach(f => {
                            const input = document.getElementById(`basic_${f.key}`);
                            if (input && !input.value && data.basic_info[f.key]) {
                                input.value = data.basic_info[f.key];
                            }
                        });
                    }

                    // 接收化验指标
                    data.data.forEach(item => {
                        if (savedFieldIds.has(item.field_id)) return; 
                        if (currentValues[item.field_id]) {
                            if (item.value) currentValues[item.field_id].value = item.value; 
                        } else {
                            currentValues[item.field_id] = item;
                        }
                    });
                    
                    currentRawText += data.raw_text + '\n';
                    uploadCount++;
                    renderReview();
                    
                    statusBar.textContent = `📸 已识别，请核对下方数据`;
                    rawText.style.display = 'block';
                    rawText.textContent = '原始文本：\n' + currentRawText;
                } else {
                    alert('您正在查看已有患者，如需覆盖数据请先解锁！');
                }
            } else {
                alert('识别失败：' + (data.error || ''));
            }
        } catch (err) {
            loading.style.display = 'none';
            alert('网络错误：' + err.message);
        }
    }

    async function savePatient() {
        const basic = {};
        // 获取 input 和 select 的值
        document.querySelectorAll('#basicList input, #basicList select').forEach(input => {
            basic[input.dataset.key] = input.value.trim();
        });

        if (!basic.hospital_id) {
            return alert('请在最上方的【住院号】输入框里填入患者住院号！');
        }

        const values = [];
        document.querySelectorAll('#reviewList input, #reviewList select').forEach(el => {
            if (el.readOnly) return; 
            if (el.value.trim() === '') return; 
            values.push({
                field_id: parseInt(el.dataset.fieldId),
                value: el.value.trim()
            });
        });

        const payload = {
            basic: basic,
            values: values
        };

        if (currentPatientId) payload.patient_id = currentPatientId;
        else payload.patient_code = basic.hospital_id; 

        const res = await fetch(`/api/project/${projectId}/patient/save`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });

        const data = await res.json();
        if (data.success) {
            alert('保存成功！');
            await loadPendingPatients();
            patientSelect.value = data.patient_id;
            currentPatientId = data.patient_id;
            await onSelectPatient();
        } else {
            alert('保存失败：' + (data.error || ''));
        }
    }

    function unlockAll() {
        if (!confirm('确定要解锁所有字段吗？解锁后可以修改已保存的值。')) return;
        savedFieldIds = new Set();
        renderReview();
        statusBar.textContent = '🔓 已解锁全部字段，可修改后重新保存';
    }

    function clearCurrent() {
        patientSelect.value = '';
        renderEmptyForm();
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function backToProject() {
        location.href = '/project/' + (projectId || 1);
    }

    async function loadPatient() {
        const res = await fetch('/api/patient/' + patientId);
        const p = await res.json();
        projectId = p.project_id;
        currentPatientId = p.id;

        renderBasicFields(p);

        const fields = await fetchProjectFields();
        currentValues = {};
        savedFieldIds = new Set();

        fields.forEach(f => {
            const existingValue = p.values[f.id] || '';
            currentValues[f.id] = {
                field_id: f.id,
                field_name: f.field_name,
                field_unit: f.field_unit,
                field_type: f.field_type || 'number',
                value: existingValue
            };
            if (existingValue && existingValue.trim() !== '') {
                savedFieldIds.add(f.id);
            }
        });
        
        renderReview();
        statusBar.textContent = `编辑模式：已保存 ${savedFieldIds.size} 个字段`;
    }

    if (patientId) {
        loadPatient();
    } else {
        renderEmptyForm(); // 打开就是手动填表状态
        loadPendingPatients();
    }
</script>
</body>
</html>
